<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a30">
  <meta name="description" content="LSTM × ARO 股價預測論文互動式簡報，依原始 39 頁投影片逐頁呈現。">
  <title>LSTM × ARO｜互動式論文簡報</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="native-slides.css">
</head>
<body>
  <main class="workspace">
    <div class="presentation">
      <div class="slide-frame" id="slideFrame" tabindex="-1">
        <div id="slide" class="slide" role="group" aria-roledescription="投影片" aria-live="polite"></div>
        <div class="slide-loading" id="loading">載入簡報中…</div>
      </div>
      <div class="toolbar">
        <div class="pager"><button id="prevBtn" aria-label="上一頁" title="上一頁（←）">←</button><span id="pageLabel">1 / 39</span><button id="nextBtn" aria-label="下一頁" title="下一頁（→）">→</button><button id="overviewBtn" class="overview-trigger" type="button" title="顯示所有頁面">全部頁面</button></div>
        <div class="progress" id="progressTrack" role="slider" tabindex="0" aria-label="選擇投影片" aria-valuemin="1" aria-valuemax="39" aria-valuenow="1" title="點擊跳到指定頁面"><div id="progressBar"></div><span id="progressThumb"></span></div>
      </div>
    </div>
  </main>
  <div id="overlay" class="overlay" hidden></div>
  <aside id="drawer" class="drawer" aria-label="延伸教材" aria-hidden="true">
    <div class="drawer-head"><div><span class="eyebrow">LEARNING LAB</span><h2 id="drawerTitle">延伸教材</h2></div><button id="closeDrawer" aria-label="關閉延伸教材">×</button></div>
    <div class="drawer-tabs" role="tablist"><button data-tab="explain" class="active" role="tab" aria-selected="true">概念拆解</button><button data-tab="widget" role="tab" aria-selected="false">動態演算</button><button data-tab="source" role="tab" aria-selected="false">來源</button></div>
    <div id="drawerBody" class="drawer-body"></div>
  </aside>
  <div id="overview" class="overview" hidden><div class="overview-panel"><div class="overview-head"><h2>全部 39 頁</h2><button id="closeOverview" aria-label="關閉頁面總覽">×</button></div><div id="overviewGrid" class="overview-grid"></div></div></div>
  <script src="slides-part1.js" defer></script>
  <script src="slides-part2.js" defer></script>
  <script src="slides-part3.js" defer></script>
  <script src="slides-data.js" defer></script>
  <script src="native-slides.js" defer></script>
  <script src="app.js" defer></script>
  <script src="lessons.js" defer></script>
  <script src="charts.js" defer></script>
  <script src="paper-data.js" defer></script>
  <script src="formula-audit.js" defer></script>
  <script src="lr-lesson.js" defer></script>
</body>
</html>
